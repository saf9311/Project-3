<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Act 1</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: Arial, sans-serif;
    }

    .fullscreen-bg {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.5s ease;
    }


    #subtitle-box {
    position: absolute;
    bottom: 30px;            
    left: 50%;
    transform: translateX(-50%); /* Centers it perfectly */
    width: 80%;
    max-width: 800px;
    background-color: rgba(0, 0, 0, 0.75);
    color: lightgoldenrodyellow;
    padding: 20px;
    border-radius: 10px;
    font-size: 1.5rem;
    text-align: center;
    display: none; 
    z-index: 5;
    border: 1px solid rgba(255, 255, 255, 0.3);
}
   #ivantalks {
   position: absolute;
   top: 15%;   
   left: 38%;  
   width: 38%; 
   height: 45%;
   cursor: pointer;
   z-index: 10; /* text needs to be on top of the character */
   display: flex;
   justify-content: center;
   align-items: center;
   padding-bottom: 20px;
}

   .ivantalks {
        color: lightgoldenrodyellow;
        font-size: 1.5rem;
        font-weight: bold;
        padding: 15px 30px;
        border-radius: 10px;
        background-color: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.3);
        user-select: none;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .ivantalks:hover {
        background-color: rgba(50, 50, 50, 0.9);
        transform: scale(1.05);
      }

      #guardcomes {
      position: absolute;
      top: 20%;
      left: 2%;
      width: 20%;
      height: 40%;
      cursor: pointer;
      z-index: 10;
      display: none; /* stays hidden till audio is done */
      justify-content: center;
      align-items: center;
    }

    audio {
      display: none;
    }

    .guardtap {
      color: #80deeb;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.85);
      border: 2px solid #1392a2;
      user-select: none;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .guardtap:hover {
      background-color: rgba(35, 200, 222, 0.72);
      transform: scale(1.05);
    }
    
  </style>
</head>

<body>

  <!-- Fullscreen Image -->
  <img src="first.jpeg" alt="Act 1 Picture" class="fullscreen-bg">

  <!-- Subtitle Display -->
  <div id="subtitle-box">...</div>

  <!-- To make act 1 start when clicked -->
  <div id="ivantalks">
    <div class="ivantalks">Talk to Ivan</div>
  </div>

  <!-- Takes you to the next act if you press on it -->
  <div id="guardcomes">
    <div class="guardtap">Find out who's coming</div>
  </div>

  <!-- The voice for act 1 -->
  <audio id="act1">
    <source src="act1.wav" type="audio/wav">
  </audio>

  <script>
    const ivantalks = document.getElementById('ivantalks');
    const guardcomes = document.getElementById('guardcomes');
    const audio = document.getElementById('act1');
    const subtitleBox = document.getElementById('subtitle-box');

    ivantalks.addEventListener('click', function() {
      // Play act 1
      audio.play();

     //clicking on the shadow figure takes you to the next act
    guardcomes.addEventListener('click', function() {
      window.location.href = 'guard.html';
    });

      // To hide the button and show the subtitle instead 
     ivantalks.style.display = 'none';
     subtitleBox.style.display = 'block';
    });

    // Update subtitles based on who is talking and the second in the audio
    audio.addEventListener('timeupdate', function() {
      let currentTime = audio.currentTime;

      if (currentTime >= 0 && currentTime < 3) {
        subtitleBox.innerHTML = "<strong>Ivan:</strong> [talking]";
      } 
      else if (currentTime >= 14 && currentTime < 20) {
        subtitleBox.innerHTML = "<strong>Jerry:</strong> [talking]";
      } 
      else if (currentTime >= 7 && currentTime < 12) {
        subtitleBox.innerHTML = "<strong>Ivan:</strong> [talking]";
      }
      else if (currentTime >= 21 && currentTime < 30) {
        subtitleBox.innerHTML = "<strong>Ivan:</strong> [talking]";
      }
      else if (currentTime >= 30 && currentTime < 36) {
        subtitleBox.innerHTML = "<strong>Jerry:</strong> [talking]";
      }
      else if (currentTime >= 36 && currentTime < 40) {
        subtitleBox.innerHTML = "<strong>Ivan:</strong> [talking]";
      }
      else if (currentTime >= 40 && currentTime < 42) {
        subtitleBox.innerHTML = "<strong>Jerry:</strong> [talking]";
      }
      else {
        subtitleBox.innerHTML = ""; // Hides subtitle when everyone is done talking
      }
     // Guard appears after the act 1 is done, so user can click for next act
      if (currentTime >= 42) {
        guardcomes.style.display = 'flex';
      }
    });

  </script>
</body>
</html>
