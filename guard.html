<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Act 2</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: Arial, sans-serif;
    }

    .fullscreen-bg {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

     #subtitle-box {
     position: absolute;
     bottom: 30px;            
     left: 50%;
     transform: translateX(-50%); /* Centers it perfectly */
     width: 80%;
     max-width: 800px;
     background-color: rgba(0, 0, 0, 0.75);
     color: lightgoldenrodyellow;
     padding: 20px;
     border-radius: 10px;
     font-size: 1.5rem;
     text-align: center;
     display: none; 
     z-index: 5;
     border: 1px solid rgba(255, 255, 255, 0.3);
       }

     audio {
      display: none;
    }

    #ivantalks {
      position: absolute;
      top: 25%;   
      left: 60%;  
      width: 25%; 
      height: 40%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

   .ivantalks {
      color: lightgoldenrodyellow;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 15px 30px;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      user-select: none;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .ivantalks:hover {
      background-color: rgba(50, 50, 50, 0.9);
      transform: scale(1.05);
    }

    #act3next {
      position: absolute;
      top: 15%;
      left: 5%;
      width: 25%;
      height: 60%;
      cursor: pointer;
      z-index: 10;
      display: none; 
      justify-content: center;
      align-items: center;
    }

    .act3next {
      color: #80deeb;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.85);
      border: 2px solid #1392a2;
      user-select: none;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .act3next:hover {
      background-color: rgba(35, 200, 222, 0.72);
      transform: scale(1.05);
    }

 </style>
</head>

<body>
     <!-- Fullscreen Image -->
  <img src="guard.png" alt="Act 2 Picture" class="fullscreen-bg">

   <!-- Subtitle Display -->
  <div id="subtitle-box">...</div>

   <!-- The voice for act 2 -->
  <audio id="act2">
    <source src="act2.wav" type="audio/wav">
  </audio>

  <!-- Starts act 2 sound when clicked -->
  <div id="ivantalks">
    <div class="ivantalks">Listen to Ivan</div>
  </div>

  <!--To go to act 3-->
  <div id="act3next">
    <div class="act3next">Go outside your cell</div>
  </div>

  <script>
    const ivantalks = document.getElementById('ivantalks');
    const act3next = document.getElementById('act3next');
    const audio = document.getElementById('act2');
    const subtitleBox = document.getElementById('subtitle-box');

    // For the audio to hide when the button is clicked and Ivan starts talking
    ivantalks.addEventListener('click', function() {
      audio.play();
      ivantalks.style.display = 'none';
      subtitleBox.style.display = 'block';
    });
   
    //To go to the next act when button is clicked
    act3next.addEventListener('click', function() {
      window.location.href = 'act3.html'; 
    });

    //Subtitles for act 2 in order of the seconds from when each character talks
    audio.addEventListener('timeupdate', function() {
      let currentTime = audio.currentTime;

      if (currentTime >= 0 && currentTime < 5) {
        subtitleBox.innerHTML = "Cell Opens";
      } 
      else if (currentTime >= 5 && currentTime < 13) {
        subtitleBox.innerHTML = "<strong>Ivan:</strong> [talking]";
      } 
      else if (currentTime >= 13 && currentTime < 16) {
        subtitleBox.innerHTML = "<strong>Guard:</strong> [Speaks demandingly]";
      }
      else if (currentTime >= 16 && currentTime < 27) {
        subtitleBox.innerHTML = "<strong>Jerry:</strong> [Talking]";
      }
      else if (currentTime >= 27 && currentTime < 30) {
        subtitleBox.innerHTML = "<strong>Guard:</strong> [Speaking]";
      }
      else if (currentTime >= 30 && currentTime <= 33) {
        subtitleBox.innerHTML = "<strong>Ivan:</strong> [talking]";
      }
      else {
        subtitleBox.innerHTML = ""; // Clears subtitle after 33 seconds
      }

      // Show the button to go outside the cell after the 
      if (currentTime >= 33) {
        act3next.style.display = 'flex';
      }
    });

  </script>
</body>
