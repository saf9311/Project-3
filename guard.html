<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Act 2</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: Arial, sans-serif;
    }

    .fullscreen-bg {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

     #subtitle-box {
     position: absolute;
     bottom: 30px;            
     left: 50%;
     transform: translateX(-50%); /* Centers it perfectly */
     width: 80%;
     max-width: 800px;
     background-color: rgba(0, 0, 0, 0.75);
     color: lightgoldenrodyellow;
     padding: 20px;
     border-radius: 10px;
     font-size: 1.5rem;
     text-align: center;
     display: none; 
     z-index: 5;
     border: 1px solid rgba(255, 255, 255, 0.3);
       }

     audio {
      display: none;
    }

    #ivantalks {
      position: absolute;
      top: 25%;   
      left: 60%;  
      width: 25%; 
      height: 40%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

   .ivantalks {
      color: lightgoldenrodyellow;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 15px 30px;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      user-select: none;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .ivantalks:hover {
      background-color: rgba(50, 50, 50, 0.9);
      transform: scale(1.05);
    }

    #act2 {
      position: absolute;
      top: 20%;
      left: 30%;
      width: 20%;
      height: 40%;
      cursor: pointer;
      z-index: 10;
      display: none; 
      justify-content: center;
      align-items: center;
    }

    .act2button {
      color: #80deeb;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.85);
      border: 2px solid #1392a2;
      user-select: none;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .act2hover {
      background-color: rgba(35, 200, 222, 0.72);
      transform: scale(1.05);
    }

 </style>
</head>

<body>
     <!-- Fullscreen Image -->
  <img src="guard.png" alt="Act 2 Picture" class="fullscreen-bg">

   <!-- Subtitle Display -->
  <div id="subtitle-box">...</div>

   <!-- The voice for act 2 -->
  <audio id="act2">
    <source src="act2.wav" type="audio/wav">
  </audio>

  <!-- Starts act 2 sound when clicked -->
  <div id="ivantalks">
    <div class="ivantalks">Listen to Ivan</div>
  </div>


</body>
