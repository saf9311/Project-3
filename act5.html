
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Act 5</title>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Background picture */
    #picture {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transition: transform 3s;
    }

    /* Image slowly zooms in */
    #picture.zoom {
      transform: scale(1.05);
    }

    /* Buttons */
    button {
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      border: 1px solid white;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
    }

    button:hover {
      background: white;
      color: black;
    }

    #startButton {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Music instructions */
    #hint {
      display: none;
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 14px;
      text-shadow: 0 2px 6px black;
      pointer-events: none;
    }

    /* Ending title screen */
    #ending {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      opacity: 0;
      visibility: hidden;
      transition: opacity 3s, visibility 3s;
      text-align: center;
    }

    #ending.show {
      opacity: 1;
      visibility: visible;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(36px, 7vw, 75px);
      font-weight: normal;
    }

    #restartButton {
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <!-- Background image -->
  <img id="picture" src="outside.jpeg" alt="Outside the prison">

  <!-- Start button -->
  <button id="startButton" onclick="startFreedom()">
    EXPERIENCE FREEDOM
  </button>

  <!-- Music -->
  <audio id="music" src="freedom.mp3"></audio>

  <!-- Instructions -->
  <p id="hint">CLICK THE IMAGE TO PAUSE / PLAY SOUND</p>

  <!-- Ending -->
  <div id="ending">
    <h1>The Noise of Freedom</h1>
    <button id="restartButton" onclick="restart()">
      EXPERIENCE AGAIN
    </button>
  </div>

  <script>
    const picture = document.getElementById("picture");
    const music = document.getElementById("music");
    const button = document.getElementById("startButton");
    const hint = document.getElementById("hint");
    const ending = document.getElementById("ending");

    let started = false;

    // Start the experience
    function startFreedom() {
      music.play().then(function() {
        started = true;
        picture.src = "freedom.jpeg";
        picture.classList.add("zoom");
        button.style.display = "none";
        hint.style.display = "block";
        picture.style.cursor = "pointer";
      }).catch(function() {
        alert("Could not play freedom.mp3");
      });
    }

    // Click the picture to pause or play
    picture.onclick = function() {
      if (!started) return;

      if (music.paused) {
        music.play();
        hint.innerText = "CLICK THE IMAGE TO PAUSE SOUND";
      } else {
        music.pause();
        hint.innerText = "SOUND PAUSED — CLICK TO CONTINUE";
      }
    };

    // Show ending after 10 seconds of music
    music.ontimeupdate = function() {
      if (music.currentTime >= 10) {
        ending.classList.add("show");
        hint.style.display = "none";
      }
    };

    // Restart the website
    function restart() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
