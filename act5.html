<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Act 1</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: Arial, sans-serif;
    }

    .fullscreen-bg {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.5s ease;
    }
    audio {
      display: none;
    }

    </style>
</head>

<body>
    <!-- Fullscreen Image -->
  <img src="outside.jpeg" alt="Act 5 Picture" class="fullscreen-bg">
