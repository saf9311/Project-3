<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Act 3</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: Arial, sans-serif;
    }

    .fullscreen-bg {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.5s ease;
    }


    #subtitle-box {
    position: absolute;
    bottom: 30px;            
    left: 50%;
    transform: translateX(-50%); /* Centers it perfectly */
    width: 80%;
    max-width: 800px;
    background-color: rgba(0, 0, 0, 0.75);
    color: lightgoldenrodyellow;
    padding: 20px;
    border-radius: 10px;
    font-size: 1.5rem;
    text-align: center;
    display: none; 
    z-index: 5;
    border: 1px solid rgba(255, 255, 255, 0.3);
    }

    audio {
      display: none;
    }

    </style>
</head>
<body>

     <!-- Fullscreen Image -->
  <img src="lady.png" alt="Act 3 Picture" class="fullscreen-bg">

  <!-- Subtitle Display -->
  <div id="subtitle-box">...</div>

  <!-- To make act 3 start when clicked -->
  <div id="ladytalks">
    <div class="ladytalks">Talk to the Lady</div>
  </div>

  <!-- The voice for act 3 -->
  <audio id="act3">
    <source src="act3.wav" type="audio/wav">
  </audio>

</body>
