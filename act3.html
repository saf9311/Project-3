<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Act 3</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: Arial, sans-serif;
    }

    .fullscreen-bg {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.5s ease;
    }


    #subtitle-box {
    position: absolute;
    bottom: 30px;            
    left: 50%;
    transform: translateX(-50%); /* Centers it perfectly */
    width: 80%;
    max-width: 800px;
    background-color: rgba(0, 0, 0, 0.75);
    color: lightgoldenrodyellow;
    padding: 20px;
    border-radius: 10px;
    font-size: 1.5rem;
    text-align: center;
    display: none; 
    z-index: 5;
    border: 1px solid rgba(255, 255, 255, 0.3);
    }

    audio {
      display: none;
    }

    /* Sound start button is positioned on the lady */
    #ladytalks {
      position: absolute;
      top: 15%;   
      left: 38%;  
      width: 25%; 
      height: 35%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ladytalks {
      color: lightgoldenrodyellow;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 15px 30px;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      user-select: none;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .ladytalks:hover {
      background-color: rgba(50, 50, 50, 0.9);
      transform: scale(1.05);
    }

    /* Where the paper is going to be signed */
    #signed {
      position: absolute;
      top: 60%;
      left: 30%;
      width: 40%;
      height: 35%;
      z-index: 10;
      display: none; /* Should only appear signed at 30 seconds */
      cursor: url('pen-cursor.jpg'), crosshair; 
    }

    .signing {
      color: #80deeb;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.85);
      border: 2px solid #1392a2;
      user-select: none;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      animation: pulse 1.5s infinite;
    }

    </style>
</head>
<body>

     <!-- Fullscreen Image and the audio starts with unsigned paper -->
  <img id="unsigned" src="unsigned.png" alt="Act 3 picture of lady and signing" class="fullscreen-bg">

  <!-- Subtitle Display -->
  <div id="subtitle-box">...</div>

  <!-- To make act 3 start when clicked -->
  <div id="ladytalks">
    <div class="ladytalks">Talk to the Lady</div>
  </div>

  <!-- Where signature will be interactive -->
  <div id="signed">
    <div class="signing">Sign the Paper</div>
    </div>

  <!-- The voice for act 3 -->
  <audio id="act3">
    <source src="act3.wav" type="audio/wav">
  </audio>

  <script>
    const ladytalks = document.getElementById('ladytalks');
    const audio = document.getElementById('act3');
    const subtitleBox = document.getElementById('subtitle-box');
    const unsigned = document.getElementById('unsigned');
    const signed = document.getElementById('signed');

    let isSigned = false;

    // For sound to start when button is clicked
    ladytalks.addEventListener('click', function() {
      audio.play();
      ladytalks.style.display = 'none';
      subtitleBox.style.display = 'block';
    });

    // To track the audio time 
    audio.addEventListener('timeupdate', function() {
      let currentTime = audio.currentTime;

      // Subtitles for act 3 in order of the seconds from when each character talks
      if (currentTime >= 3 && currentTime < 19) {
        subtitleBox.innerHTML = "<strong>Lady:</strong> [talking]";
      } 
      else if (currentTime >= 20 && currentTime < 23) {
        subtitleBox.innerHTML = "<strong>Jerry:</strong> [mumbling]";
      } 
      else if (currentTime >= 25 && currentTime < 28) {
        subtitleBox.innerHTML = "<strong>Jerry:</strong> [talking sarcastically]";
      }
      else if (currentTime >= 29 && currentTime <= 36) {
        subtitleBox.innerHTML = "<strong>Lady:</strong> [replying sarcastically]";
      }
      else {
        subtitleBox.innerHTML = "";
      }

      // So that the cursor turns into a pen when the time is 19 seconds into the audio
      if (currentTime >= 19 && currentTime < 30 && !isSigned) {
        signed.style.display = 'block';
      }

      // When time is 30 seconds the signed image will be placed instead
      if (currentTime >= 30 && !isSigned) {
        unsigned.src = 'lady.png';
        isSigned = true;
        signed.style.display = 'none';
      }
    });

  </script>

</body>
</html>
